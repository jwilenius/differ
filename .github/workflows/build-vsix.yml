name: Build VS Code installer

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    # scripts/release.sh pushes its release commit and tag together; the tag run builds and publishes that commit.
    if: "github.ref_type == 'tag' || !startsWith(github.event.head_commit.message, 'chore: release v')"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$VERSION"
      - run: npm run typecheck
      - run: npm test
      - name: Package release installer
        if: github.ref_type == 'tag'
        run: npm run package
      # Development builds carry the last release's version, so name them by commit to avoid clashing with it.
      - name: Package development installer
        if: github.ref_type != 'tag'
        run: npm run package -- --out "differ-main-${GITHUB_SHA::7}.vsix"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: differ-vsix
          path: '*.vsix'
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: differ-vsix
          path: installer
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" installer/*.vsix \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
