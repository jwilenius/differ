name: Build and release VS Code installer

# Every push to main is checked and packaged; when its Conventional Commits since the last release ask for one, the
# same run commits the version bump, tags it and publishes a GitHub Release. Pushes made with GITHUB_TOKEN start no
# workflow, so the release commit and tag do not run this again.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Runs queue instead of overlapping, and a release in progress is never cancelled. A newer push replaces a run still
# waiting in the queue; that newer run scans every commit since the last release anyway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.release-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The release decision reads every commit and tag since the last release.
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      # Decided before any dependency code runs, so that code cannot change the decision; the checks below still gate
      # the release.
      - name: Decide release version
        id: release-version
        if: github.ref == 'refs/heads/main'
        # Assigned separately, so a failing script fails the step instead of reading as "no release".
        run: |
          version=$(node scripts/next-release-version.mjs)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Check the lockfile and registry signatures before any dependency install script runs.
      - run: npm run check:deps
      - run: npm ci --ignore-scripts
      - id: signatures
        run: npm run check:signatures
      # Records what this runner sees when the signature check fails; the failed check still fails the job.
      - name: Show signature check diagnostics
        if: failure() && steps.signatures.outcome == 'failure'
        continue-on-error: true
        run: |
          set +e
          registry=$(npm config get registry)
          registry=${registry%/}
          cache=${npm_config_cache:-$HOME/.npm}
          echo "node $(node --version), npm $(npm --version), registry $registry, cache $cache"
          # The failing package from the check's log, e.g. "error postcss@8.5.32 has attestations but no ...".
          package=$(sed -nE 's/.* error (@?[^@ ]+@[^ ]+) has .*/\1/p' "$cache"/_logs/*.log | head -n 1)
          fetch() {
            echo "::group::$1"
            curl -sS -D - -o "$RUNNER_TEMP/response.json" "$registry$1"
            jq -c "$2" "$RUNNER_TEMP/response.json"
            echo "::endgroup::"
          }
          fetch /-/npm/v1/keys '.keys[] | {keyid, expires}'
          if [ -n "$package" ]; then
            fetch "/-/npm/v1/attestations/${package/\//%2f}" \
              '.attestations[] | {predicateType, keyids: [.bundle.dsseEnvelope.signatures[].keyid]}'
          fi
          # npm prefers the registry keys from the Sigstore TUF repository cached here over /-/npm/v1/keys.
          echo "::group::TUF cache"
          find "$cache/_tuf" -type f -printf '%TY-%Tm-%Td %TH:%TM %p\n'
          for metadata in "$cache"/_tuf/*/*.json; do
            echo "$metadata $(jq -c '{version: .signed.version, expires: .signed.expires}' "$metadata")"
          done
          for keys in "$cache"/_tuf/*/targets/*keys.json; do
            jq -c '.keys[] | {keyId, keyUsage, validFor: .publicKey.validFor}' "$keys"
          done
          echo "::endgroup::"
          echo "::group::npm audit signatures --loglevel silly"
          npm audit signatures --loglevel silly
          echo "::endgroup::"
      - name: Upload npm logs
        if: failure() && steps.signatures.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.2
        with:
          name: npm-signature-check-logs
          path: ~/.npm/_logs/*.log
          retention-days: 7
      - run: npm rebuild
      - run: npm run typecheck
      - run: npm test
      - name: Package release installer
        if: steps.release-version.outputs.version != ''
        env:
          VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version
          npm run package
      # Development builds carry the last release's version, so name them by commit to avoid clashing with it.
      - name: Package development installer
        if: steps.release-version.outputs.version == ''
        run: npm run package -- --out "jw-differ-main-${GITHUB_SHA::7}.vsix"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: jw-differ-vsix
          path: '*.vsix'
          if-no-files-found: error
          retention-days: 30

  # The only jobs with write access; they run no dependency code. Tagging and publishing are separate jobs so that
  # "Re-run failed jobs" can retry a failed publish without tagging again.
  tag:
    needs: package
    if: needs.package.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.package.outputs.version }}
    steps:
      # Checks out the tested commit, not the current main.
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Commit and tag release
        run: |
          # The version passed through a job that ran dependency code; accept only plain X.Y.Z.
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release version '$VERSION' is not plain X.Y.Z."
            exit 1
          fi
          npm version "$VERSION" --no-git-tag-version
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m "chore: release v$VERSION"
          git tag -a "v$VERSION" -m "Release v$VERSION"
      # Publishes the commit and tag together; if main moved during the run, neither remote ref changes and the run
      # fails. The run for the newer push releases these commits too, unless that push skipped CI: then run this
      # workflow on main by hand.
      - name: Push release commit and tag
        run: git push --atomic origin main "refs/tags/v$VERSION"

  publish:
    needs: [package, tag]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.package.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: jw-differ-vsix
          path: installer
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v$VERSION" installer/*.vsix \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "v$VERSION" \
            --generate-notes
